[package]
name = "kite"
description = "A fast, low-memory SSH terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Opt-in runtime Metal shader compilation for hosts without full Xcode Metal tools.
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
anyhow = "1"
gpui = { package = "gpui-pre", version = "=0.3.8" }
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-segmentation = "1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
kite-ssh.workspace = true
kite-term.workspace = true
kite-sync.workspace = true
kite-vault.workspace = true
base64 = "0.23"
chrono.workspace = true
ureq.workspace = true
image.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "registry"] }
strip-ansi-escapes = "0.2.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["poll"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true
# libmalloc keeps a freed 256 MiB scrypt block resident; mimalloc hands it back to the OS.
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", features = ["extended"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGGeometry", "CGImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSLocale", "NSString"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# Off macOS the vault passphrase lives in the platform credential store through `keyring`:
# Windows Credential Manager, or the Secret Service (GNOME Keyring, KWallet) on Linux.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

# gpui_platform turns both Linux backends off by default; without one `application()` panics.
[target.'cfg(target_os = "linux")'.dependencies.gpui_platform]
package = "gpui-pre-platform"
version = "=0.3.8"
features = ["wayland", "x11"]
