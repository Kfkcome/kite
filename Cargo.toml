[workspace]
resolver = "2"
members = ["crates/*"]
# The vendored crate is a path dependency, not a workspace member: our lints and `--workspace` runs skip it.
exclude = ["vendor"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"
repository = "https://github.com/Kfkcome/kite"

[workspace.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
kite-ssh = { path = "crates/kite-ssh", version = "0.2.0" }
kite-sync = { path = "crates/kite-sync", version = "0.2.0" }
kite-term = { path = "crates/kite-term", version = "0.2.0" }
kite-vault = { path = "crates/kite-vault", version = "0.2.0" }
# Wallpaper decoding; the same 0.25 gpui renders with, so no second copy is built.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Exact pin: russh pins the same pre-release, so kite-vault shares its copy.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ed25519", "std"] }
rand = { version = "0.10", features = ["thread_rng"] }
security-framework = "3"
keyring = { version = "3", default-features = false }

russh-sftp = "3.0.1"
# Local-time dates in the file browser.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Craft gates. Every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
large_futures = "warn"
needless_pass_by_value = "warn"
# Rust API Guidelines C-FAILURE: every public fallible fn documents its errors.
missing_errors_doc = "warn"
disallowed_methods = "deny"

# Scrollback rows keep only the cells they use. See vendor/alacritty_terminal/TERN-PATCH.md.
# macOS 27 moves the window from mouseDragged: instead of performWindowDragWithEvent:.
# See vendor/gpui-pre-macos/TERN-PATCH.md.
# Metal renderer / atlas memory patches and CJK integer-x glyph snapping.
# See vendor/gpui-pre-apple/TERN-PATCH.md and vendor/gpui-pre/TERN-PATCH.md.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

# Small, fast release binary. Measured, not assumed: see docs/perf.md.
[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
incremental = false

[profile.release.package."*"]
opt-level = "s"

[profile.release.package.kite-term]
opt-level = 2

[profile.release.package.alacritty_terminal]
opt-level = 2

[profile.release.package.vte]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2   # deps optimised even in dev, so the terminal is usable while developing
